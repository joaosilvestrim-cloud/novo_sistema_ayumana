<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#F1F5F3;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <tr><td align="center" style="padding:32px 16px;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;">
      <tr><td align="center" style="padding-bottom:20px;">
        <img src="https://www.ayumana.com.br/brand/ayumana-logo.png" width="150" alt="Ayumana" style="display:block;width:150px;height:auto;border:0;"/>
      </td></tr>
      <tr><td style="background:#FFFFFF;border:1px solid #E3EAE7;border-radius:18px;overflow:hidden;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr>
          <td width="25%" height="5" style="background:#05474A;font-size:0;line-height:0;">&nbsp;</td>
          <td width="25%" height="5" style="background:#73A533;font-size:0;line-height:0;">&nbsp;</td>
          <td width="25%" height="5" style="background:#53C4CC;font-size:0;line-height:0;">&nbsp;</td>
          <td width="25%" height="5" style="background:#F5C84B;font-size:0;line-height:0;">&nbsp;</td>
        </tr></table>
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr><td style="padding:34px;">
          <h1 style="margin:0 0 14px;font-family:Georgia,serif;font-size:24px;font-weight:400;color:#05474A;">Seu link de acesso</h1>
          <p style="margin:0 0 18px;font-size:16px;line-height:1.6;color:#2B3A38;">Clique no botão abaixo para entrar na Ayumana. O link vale por pouco tempo e é só seu.</p>
          <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:6px 0;"><tr>
            <td align="center" style="background:#73A533;border-radius:10px;">
              <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=magiclink&next=/painel" style="display:inline-block;padding:14px 30px;font-size:16px;font-weight:700;color:#ffffff;text-decoration:none;">Entrar na Ayumana</a>
            </td>
          </tr></table>
          <p style="margin:22px 0 0;font-size:13px;line-height:1.6;color:#6B7A77;">Se você não pediu este acesso, ignore este e-mail.</p>
        </td></tr></table>
      </td></tr>
      <tr><td align="center" style="padding:20px 12px;font-size:12px;line-height:1.7;color:#6B7A77;">
        <strong style="color:#05474A;">Ayumana</strong> — terapia em português, onde você estiver.<br/>
        Em crise? Ligue para o CVV no <strong>188</strong>. É gratuito e funciona 24 horas.
      </td></tr>
    </table>
  </td></tr>
</table>
